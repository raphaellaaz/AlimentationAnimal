<div class="top-bar">
  <img src="/assets/imagenes/LOGOTIPO UNL_Mesa de trabajo 1.png" alt="Logo UNL" class="logo-unl">
  <div class="button-group">
    <button routerLink="/login">
      <mat-icon>login</mat-icon>
      Iniciar Sesión
    </button>
    <button routerLink="/register">
      <mat-icon>person_add</mat-icon>
      Registrarse
    </button>
  </div>
</div>



<form  class="form-container">
  <div class="formform">

    <mat-form-field appearance="outline" class="example-full-width">
      <mat-label>Cantidad a Formular</mat-label>
      <mat-icon matPrefix>scale</mat-icon>
      <input matInput type="number" min="0" (input)="onChangeValue($event)" placeholder="kilogramos">
    </mat-form-field>


    <div class="etapa_especie">

      <app-searchespecie-inp class="especie">
        <mat-icon matPrefix>pets</mat-icon>
      </app-searchespecie-inp>

      <app-searchetapa-inp class="etapa">
        <mat-icon matPrefix>timeline</mat-icon>
      </app-searchetapa-inp>
      
    </div>

    <app-searchingrediente-inp>
      <mat-icon matPrefix>inventory_2</mat-icon>
    </app-searchingrediente-inp>

    <div class="button-group">
      <button mat-raised-button color="primary" (click)="onFormular()">
        <mat-icon>calculate</mat-icon>
        Formular
      </button>
      <button mat-button color="warn">
        <mat-icon>delete_sweep</mat-icon>
        Limpiar
      </button>
    </div>
  </div>

  <div class="right-side-box">
    

        <table class="info-table">
          <!-- Cantidad -->
          <tr>
            <td class="tags">Cantidad:</td>
            <td class="tags-value">{{ peso }} Kg</td>
          </tr>
    
          <!-- Especie -->
          <tr>
            <td class="tags">Especie:</td>
            <td class="tags-value">{{ selectedEspecie.nombre }}</td>
          </tr>
    
          <!-- Etapa -->
          <tr>
            <td class="tags">Etapa:</td>
            <td class="tags-value">{{ selectedEtapa.nombre_etapa}}</td>
          </tr>
        </table>
    
        <!-- Ingredientes -->
        <div class="ingredients-section">
          <h3>Ingredientes:</h3>
          
          <mat-list class="small-list">
            @for (item of selectedIngredientes; track $index) {
              <mat-list-item class="small-item">{{item.Nombre_Ingrediente}}</mat-list-item>
            }
           </mat-list>
    
          <!-- Si hay muchos ingredientes, mostrar como tabla -->
         
        </div>
   
    


  </div>
</form>

<img src="assets/imagenes/login-background.png" class="logo-esquina" alt="Logo esquina">
