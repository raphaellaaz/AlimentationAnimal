<h2 mat-dialog-title>Precio Ingrediente</h2>
<mat-dialog-content>
  <form [formGroup]="form">
    <label for="ingredienteInput">Ingrediente:</label>
    <input id="ingredienteInput" type="number" [formControl]="ingredienteControl" min="0">

  </form>
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button mat-dialog-close (click)="closeDialog()">Cancelar</button>
  <button mat-button (click)="onPriceInput($event)">Listo</button>
</mat-dialog-actions>
