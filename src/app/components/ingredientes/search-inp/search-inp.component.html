<mat-form-field appearance="outline" class="field_ingrediente">
    <mat-label>Ingrediente</mat-label>
    <mat-icon matPrefix style="color: #4CAF50;">inventory_2</mat-icon>
    <input type="text"
           placeholder="Buscar"
           aria-label="Ingrediente"
           matInput
           [formControl]="myControl"
           [matAutocomplete]="auto">
           <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onShowInputPrice($event)">
      @for (option of filteredOptions | async; track option) {
        <mat-option [value]="option">{{option.Nombre_Ingrediente}}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>


<div class="chip-list-container">
  @for (item of ingredientesConPrecio; track $index) {
    <mat-chip [removable]="true" (removed)="removeItem(item)">
      {{ item.Nombre_Ingrediente }}
      <mat-icon matChipRemove>close</mat-icon>
    </mat-chip>
  }
</div>
